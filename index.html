<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bryan & Kristine Wedding</title>
    <!-- Import Elegant Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Floral Elements (Placeholders for your watercolor images) -->
    <div class="floral-bg left"></div>
    <div class="floral-bg right"></div>

    <!-- Main Interactive Envelope -->
    <div class="envelope-wrapper" id="envelope">

        <!-- The top flap that opens -->
        <div class="flap top-flap"></div>

        <!-- The Invitation Card -->
        <div class="card">
            <div class="card-content">
                <h1 class="script gold">You are invited!</h1>
                <h2 class="serif gold names">Bryan & Kristine</h2>
                <div class="details serif">
                    <p>Thursday, January 7, 2027</p>
                    <p>Subic, Zambales</p>
                </div>
                <button class="rsvp-btn serif" id="rsvp-btn">VIEW DETAILS & RSVP</button>
            </div>
        </div>

        <!-- The bottom and side flaps of the envelope -->
        <div class="flap left-flap"></div>
        <div class="flap right-flap"></div>
        <div class="flap bottom-flap"></div>

        <!-- The Wax Seal -->
        <div class="wax-seal">
            <div class="seal-ring"></div>
            <span class="serif gold seal-text">B&K</span>
        </div>

    </div>

    <!-- Elegant Watermark -->
    <div class="watermark serif">
        THE <span>PARISIAN</span> INVITES
    </div>

    <script src="script.js"></script>
</body>

</html>
